<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba Practi Front 1</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Prueba Practi Front 1</h1>
            <p>Aplicación de práctica front-end</p>
        </header>
        
        <main>
            <section class="welcome-section">
                <h2>Bienvenido</h2>
                <p>Esta es una aplicación de práctica para desarrollo front-end.</p>
                
                <div class="interactive-area">
                    <h3>Área Interactiva</h3>
                    <input type="text" id="nameInput" placeholder="Ingresa tu nombre">
                    <button id="greetButton">Saludar</button>
                    <div id="greeting" class="greeting-output"></div>
                </div>
                
                <div class="counter-section">
                    <h3>Contador</h3>
                    <p>Contador actual: <span id="counterValue">0</span></p>
                    <button id="incrementBtn">Incrementar</button>
                    <button id="decrementBtn">Decrementar</button>
                    <button id="resetBtn">Reiniciar</button>
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2024 Prueba Practi Front 1</p>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
